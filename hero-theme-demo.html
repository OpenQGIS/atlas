<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>首屏深浅主题切换效果对比 Demo · AtlasLog</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Demo 专属控制悬浮面板 */
    .demo-control-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(18, 22, 30, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 100px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255,255,255,0.3);
      color: #fff;
      font-size: 0.82rem;
      user-select: none;
      transition: all 0.3s ease;
    }
    :root[data-theme="light"] .demo-control-dock {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.12);
      color: #1a1f2c;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 0 1px rgba(0,0,0,0.2);
    }
    .demo-pill-group {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    :root[data-theme="light"] .demo-pill-group {
      background: rgba(0, 0, 0, 0.06);
    }
    .demo-btn {
      background: transparent;
      border: none;
      color: inherit;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .demo-btn.active {
      background: #e6c37d;
      color: #1a1308;
      box-shadow: 0 2px 8px rgba(230, 195, 125, 0.4);
      font-weight: 600;
    }
    .demo-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.18);
    }
    :root[data-theme="light"] .demo-divider {
      background: rgba(0, 0, 0, 0.12);
    }

    /* 方案模式切换支持 */
    /* 1. 现状模式 (Before - 浅色时首屏不变化，依然黑夜) */
    html[data-mode="before"][data-theme="light"] .hero-screen {
      background-color: #0b0d10 !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(11, 13, 16, 0.4) 0%, rgba(11, 13, 16, 0.88) 100%),
                  linear-gradient(to bottom, rgba(11, 13, 16, 0.5) 0%, transparent 35%, rgba(11, 13, 16, 0.8) 100%) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="before"][data-theme="light"] .hero-slogan-sep-svg {
      color: #ffffff !important;
      filter: drop-shadow(0 4px 28px rgba(0, 0, 0, 0.85)) drop-shadow(0 1px 4px rgba(0, 0, 0, 0.95)) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-subtitle {
      color: rgba(255, 255, 255, 0.9) !important;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-desc {
      color: rgba(255, 255, 255, 0.65) !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7) !important;
    }

    /* 2. 方案一：昼夜双生质感（Day/Night Contrast · 宣纸水墨 vs 夜境沉浸 · 推荐） */
    html[data-mode="scheme-1"] .hero-screen,
    html[data-mode="scheme-1"] .hero-bg,
    html[data-mode="scheme-1"] .hero-scrim,
    html[data-mode="scheme-1"] .hero-slogan-svg,
    html[data-mode="scheme-1"] .hero-subtitle,
    html[data-mode="scheme-1"] .hero-desc {
      transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  text-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-screen {
      background-color: #f6f7f9 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-bg {
      filter: brightness(1.02) contrast(1.02) saturate(1.05) !important;
      opacity: 0.88 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(246, 247, 249, 0.35) 0%, rgba(246, 247, 249, 0.82) 100%),
                  linear-gradient(to bottom, rgba(246, 247, 249, 0.6) 0%, transparent 40%, rgba(246, 247, 249, 0.92) 100%) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="scheme-1"][data-theme="light"] .hero-slogan-sep-svg {
      color: #141a24 !important;
      filter: drop-shadow(0 2px 14px rgba(255, 255, 255, 0.9)) drop-shadow(0 1px 2px rgba(20, 26, 36, 0.2)) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-subtitle {
      color: #2b3342 !important;
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.95) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-desc {
      color: #556072 !important;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.95) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-scroll-btn {
      color: #2b3342 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .scroll-mouse-anim {
      border-color: rgba(43, 51, 66, 0.5) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .scroll-mouse-dot {
      background-color: #2b3342 !important;
    }

    /* 3. 方案二：柔光微霜轻覆（Soft Frost Wash） */
    html[data-mode="scheme-2"][data-theme="light"] .hero-screen {
      background-color: #18202c !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-bg {
      filter: brightness(0.85) contrast(1.05) saturate(1.15) !important;
      opacity: 0.9 !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(230, 238, 248, 0.15) 0%, rgba(20, 28, 40, 0.75) 100%),
                  linear-gradient(to bottom, rgba(240, 244, 250, 0.2) 0%, transparent 40%, rgba(20, 28, 40, 0.85) 100%) !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="scheme-2"][data-theme="light"] .hero-slogan-sep-svg {
      color: #ffffff !important;
      filter: drop-shadow(0 4px 20px rgba(10, 16, 26, 0.9)) drop-shadow(0 0 35px rgba(230, 195, 125, 0.4)) !important;
    }

    /* 圆形光晕涟漪过渡效果 (View Transition / Clip Path Ripple) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) {
      z-index: 1;
    }
    ::view-transition-new(root) {
      z-index: 999;
    }
    .ripple-active::view-transition-new(root) {
      animation: rippleExpand 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes rippleExpand {
      from {
        clip-path: circle(0px at var(--ripple-x, 95%) var(--ripple-y, 30px));
      }
      to {
        clip-path: circle(150vmax at var(--ripple-x, 95%) var(--ripple-y, 30px));
      }
    }
  
    /* ========================================================
       铭牌暗色模式优化方案 (解决“暗色下边还是很暗”的问题)
       ======================================================== */
    /* 铭牌基础过渡 */
    .hero-brand-capsule,
    .hero-brand-capsule .hero-brand-svg {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* 方案 A：暖金古铜 + 底部暖金反光切角 (消除下部死黑，提亮下半段) */
    html[data-badge="warm-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        #725b33 0%,
        #4c3a1d 25%,
        #886e3f 50%,
        #3e2f16 58%,
        #614d27 82%,
        #463519 100%
      ) !important;
      border: 1px solid rgba(255, 225, 150, 0.6) !important;
      border-bottom: 1.5px solid rgba(255, 235, 175, 0.75) !important; /* 关键：底沿高光金线托底 */
      box-shadow:
        inset 0 1.5px 2px rgba(255, 240, 195, 0.75),
        inset 0 -1.5px 2px rgba(255, 220, 130, 0.4), /* 关键：将死黑内阴影替换为暖金底缘回光 */
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 16px rgba(230, 185, 95, 0.25) !important; /* 柔和暖金环境微光 */
      color: #fae7ba !important; /* 文字改为香槟暖金色，黑夜中清晰夺目 */
    }
    html[data-badge="warm-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 1px rgba(255, 240, 190, 0.6)) !important;
    }

    /* 方案 B：温润亮黄铜（与浅色同为纯铜金印，黑夜中金牌璀璨） */
    html[data-badge="bright-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        #f5ecd5 0%,
        #d8c292 25%,
        #fcf6e8 50%,
        #c9ae78 65%,
        #eddcb5 85%,
        #d4bc88 100%
      ) !important;
      border: 1px solid rgba(210, 175, 105, 0.75) !important;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px rgba(120, 90, 35, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.65),
        0 0 20px rgba(230, 195, 125, 0.32) !important;
      color: #2b1f0c !important; /* 阴刻深墨字标，8:1 高对比度 */
    }
    html[data-badge="bright-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 1.2px 0 rgba(255, 255, 255, 0.85))
        drop-shadow(0 -1px 0.5px rgba(60, 45, 20, 0.5)) !important;
    }

    /* 方案 C：黑曜微晶 + 鎏金立体字标 + 金边环绕 (现代低调轻奢) */
    html[data-badge="obsidian-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        rgba(36, 44, 58, 0.85) 0%,
        rgba(18, 22, 30, 0.92) 50%,
        rgba(26, 32, 44, 0.9) 100%
      ) !important;
      border: 1px solid rgba(230, 195, 125, 0.55) !important;
      border-bottom: 1.5px solid rgba(255, 230, 160, 0.7) !important;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.2),
        inset 0 -1.5px 2px rgba(230, 195, 125, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(230, 195, 125, 0.2) !important;
      color: #f7dfa5 !important;
    }
    html[data-badge="obsidian-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 0 8px rgba(230, 195, 125, 0.5))
        drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9)) !important;
    }

  
    /* ========================================================
       右上角控制胶囊多形态与微晶磨砂玻璃切换 (Actions Capsule)
       ======================================================== */
    /* 03 多段式微晶胶囊 (Header Actions Liquid Capsule 03 效果) */
    .hero-actions-capsule {
      position: relative;
      z-index: 20;
      overflow: visible !important;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 5px;
      border-radius: 9999px;
      user-select: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    
    /* ========================================================
       右上角胶囊光照角度系统 (解决“高光垂直向下无倾斜角”的问题)
       ======================================================== */
    /* 默认光照倾角：135° 自然天光入射 (10:30 天光弧) */
    html:not([data-light-angle]) {
      --capsule-angle-deg: 135deg;
      --capsule-light-x: 1.8px;
      --capsule-light-y: 1.5px;
      --capsule-shadow-x: -1.4px;
      --capsule-shadow-y: -1.2px;
      --spot-pos: 26% 20%;
    }
    html[data-light-angle="135deg"] {
      --capsule-angle-deg: 135deg;
      --capsule-light-x: 1.8px;
      --capsule-light-y: 1.5px;
      --capsule-shadow-x: -1.4px;
      --capsule-shadow-y: -1.2px;
      --spot-pos: 26% 20%;
    }
    html[data-light-angle="115deg"] {
      --capsule-angle-deg: 115deg;
      --capsule-light-x: 2.2px;
      --capsule-light-y: 1.0px;
      --capsule-shadow-x: -1.8px;
      --capsule-shadow-y: -0.8px;
      --spot-pos: 20% 25%;
    }
    html[data-light-angle="90deg"] {
      --capsule-angle-deg: 180deg;
      --capsule-light-x: 0px;
      --capsule-light-y: 1.8px;
      --capsule-shadow-x: 0px;
      --capsule-shadow-y: -1.2px;
      --spot-pos: 50% 0%;
    }

    /* 03 多段式微晶胶囊 (液态磨砂玻璃 · 135°倾角聚光) */
    html[data-top-capsule="liquid-03"] .hero-actions-capsule {
      background: 
        radial-gradient(circle at var(--spot-pos), rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 72%),
        linear-gradient(var(--capsule-angle-deg), rgba(25, 34, 48, 0.65) 0%, rgba(14, 18, 26, 0.52) 55%, rgba(18, 24, 34, 0.65) 100%) !important;
      backdrop-filter: blur(20px) saturate(260%) contrast(104%);
      -webkit-backdrop-filter: blur(20px) saturate(260%) contrast(104%);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-left-color: rgba(255, 255, 255, 0.68);
      border-right-color: rgba(255, 255, 255, 0.20);
      border-bottom-color: rgba(255, 255, 255, 0.12);
      box-shadow: 
        inset var(--capsule-light-x) var(--capsule-light-y) 2.4px 0 rgba(255, 255, 255, 0.58),
        inset var(--capsule-shadow-x) var(--capsule-shadow-y) 1.8px 0 rgba(0, 0, 0, 0.40),
        0 0 0 1px rgba(56, 189, 248, 0.15),
        0px 8px 24px -2px rgba(0, 0, 0, 0.45) !important;
    }

    html[data-top-capsule="liquid-03"][data-theme="light"] .hero-actions-capsule {
      background: 
        radial-gradient(circle at var(--spot-pos), rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.20) 45%, transparent 72%),
        linear-gradient(var(--capsule-angle-deg), rgba(255, 255, 255, 0.75) 0%, rgba(245, 248, 252, 0.55) 55%, rgba(255, 255, 255, 0.70) 100%) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-top-color: #ffffff;
      border-left-color: rgba(255, 255, 255, 0.95);
      border-right-color: rgba(255, 255, 255, 0.45);
      border-bottom-color: rgba(255, 255, 255, 0.35);
      box-shadow: 
        inset var(--capsule-light-x) var(--capsule-light-y) 2.2px 0 rgba(255, 255, 255, 1),
        inset var(--capsule-shadow-x) var(--capsule-shadow-y) 1.5px 0 rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(56, 189, 248, 0.15),
        0px 6px 18px -3px rgba(0, 0, 0, 0.12) !important;
    }

    html[data-top-capsule="liquid-03"] .hero-actions-capsule:hover {
      border-top-color: #ffffff;
      border-left-color: rgba(255, 255, 255, 0.95);
      box-shadow: 
        inset calc(var(--capsule-light-x) * 1.1) calc(var(--capsule-light-y) * 1.1) 2.8px 0 rgba(255, 255, 255, 0.75),
        inset var(--capsule-shadow-x) var(--capsule-shadow-y) 1.8px 0 rgba(0, 0, 0, 0.45),
        0 0 0 1.5px rgba(56, 189, 248, 0.25),
        0 10px 28px -3px rgba(0, 0, 0, 0.55) !important;
    }

    /* 内部水滴按钮：悬停与激活同样采用 135° 自然天光 */
    .hero-actions-capsule .capsule-btn:hover,
    .hero-actions-capsule .lang-dropdown-btn[aria-expanded="true"] {
      background: radial-gradient(circle at var(--spot-pos), rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 55%, transparent 80%) !important;
      box-shadow: inset 1px 1px 1.5px rgba(255, 255, 255, 0.35);
      color: #fff !important;
    }
    :root[data-theme="light"] .hero-actions-capsule .capsule-btn:hover,
    :root[data-theme="light"] .hero-actions-capsule .lang-dropdown-btn[aria-expanded="true"] {
      background: radial-gradient(circle at var(--spot-pos), rgba(255, 255, 255, 0.85) 0%, rgba(0, 0, 0, 0.03) 60%, transparent 80%) !important;
      box-shadow: inset 1px 1px 1.5px rgba(255, 255, 255, 0.95);
      color: #0b0d10 !important;
    }

    /* 形态 2：超高透冰晶舱 (35% 超薄通透 + 冰棱冷光) */
    html[data-top-capsule="hyper-clear"] .hero-actions-capsule {
      background: rgba(10, 15, 24, 0.32);
      backdrop-filter: blur(28px) saturate(280%);
      -webkit-backdrop-filter: blur(28px) saturate(280%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top: 1.8px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.6),
        0 12px 32px rgba(0, 0, 0, 0.45);
    }
    html[data-top-capsule="hyper-clear"][data-theme="light"] .hero-actions-capsule {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.65);
      border-top-color: #ffffff;
      box-shadow: 
        inset 0 1.5px 2px #fff,
        0 10px 28px rgba(0, 0, 0, 0.08);
    }

    /* 形态 3：温润暖金古铜微晶 (与中间主标铭牌呼应) */
    html[data-top-capsule="amber-gold"] .hero-actions-capsule {
      background: linear-gradient(135deg, rgba(85, 68, 38, 0.65) 0%, rgba(35, 26, 12, 0.75) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 225, 150, 0.55);
      border-bottom: 1.5px solid rgba(255, 235, 175, 0.75);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 240, 195, 0.65),
        inset 0 -1.2px 1.5px rgba(255, 220, 130, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 12px rgba(230, 185, 95, 0.2);
    }
    html[data-top-capsule="amber-gold"] .capsule-btn {
      color: #fae7ba !important;
    }
    html[data-top-capsule="amber-gold"] .capsule-divider {
      background: rgba(255, 225, 150, 0.3) !important;
    }

    /* 形态 4：现状离散独立圆钮 (Before) */
    html[data-top-capsule="separated"] .hero-actions-capsule {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      gap: 10px !important;
      padding: 0 !important;
    }
    html[data-top-capsule="separated"] .hero-actions-capsule .capsule-divider {
      display: none !important;
    }
    html[data-top-capsule="separated"] .hero-actions-capsule .lang-dropdown-btn {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 100px !important;
      padding: 6px 14px !important;
      height: 36px !important;
      color: #fff !important;
    }
    html[data-top-capsule="separated"] .hero-actions-capsule .hero-theme-btn {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 50% !important;
      width: 36px !important;
      height: 36px !important;
      color: #fff !important;
    }

    /* 内部水滴按键基础属性 */
    .hero-actions-capsule .capsule-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 10px;
      border: none;
      background: transparent;
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] .hero-actions-capsule .capsule-btn {
      color: #1a2230;
    }
    .hero-actions-capsule .capsule-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }
    :root[data-theme="light"] .hero-actions-capsule .capsule-btn:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #0b0d10;
    }
    .hero-actions-capsule .hero-theme-btn {
      width: 32px;
      padding: 0;
    }
    .hero-actions-capsule .capsule-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="light"] .hero-actions-capsule .capsule-divider {
      background: rgba(0, 0, 0, 0.12);
    }

  
    /* ========================================================
       左下角背景画卷图名多形态与材质规范 (Hero Artwork Tag)
       ======================================================== */
    .hero-artwork-tag {
      position: absolute;
      left: 28px;
      bottom: 24px;
      right: auto;
      top: auto;
      z-index: 15;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: var(--font-sans);
      pointer-events: auto;
      cursor: default;
      user-select: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-artwork-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: 0.85;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hero-artwork-prefix {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-right: 2px;
    }

    .hero-artwork-name {
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
    }

    /* 选项 1：微晶磨砂画签 (03 Actions 质感联动 · 推荐) */
    html[data-art-tag="liquid-glass"] .hero-artwork-tag {
      background: rgba(16, 22, 32, 0.52);
      backdrop-filter: blur(20px) saturate(240%) contrast(104%);
      -webkit-backdrop-filter: blur(20px) saturate(240%) contrast(104%);
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      border-top: 2.0px solid rgba(255, 255, 255, 0.72);
      box-shadow: 
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.40),
        inset 0 -1.2px 1.5px 0 rgba(255, 255, 255, 0.10),
        0 8px 24px -2px rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.92);
    }
    html[data-art-tag="liquid-glass"] .hero-artwork-tag .hero-artwork-name {
      color: #f7e0aa; /* 典雅香槟暖金，告别生硬荧光绿 */
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    html[data-art-tag="liquid-glass"] .hero-artwork-tag:hover {
      border-color: rgba(255, 255, 255, 0.40);
      border-top-color: rgba(255, 255, 255, 0.90);
      box-shadow: 
        inset 0 1.8px 2.4px 0 rgba(255, 255, 255, 0.55),
        0 10px 28px rgba(0, 0, 0, 0.55);
    }
    html[data-art-tag="liquid-glass"][data-theme="light"] .hero-artwork-tag {
      background: rgba(255, 255, 255, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-top: 2.0px solid rgba(255, 255, 255, 1);
      box-shadow: 
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 1),
        inset 0 -1.2px 1.5px 0 rgba(255, 255, 255, 0.35),
        0 6px 18px -2px rgba(0, 0, 0, 0.12);
      color: #1e293b;
    }
    html[data-art-tag="liquid-glass"][data-theme="light"] .hero-artwork-tag .hero-artwork-name {
      color: #1e293b;
      text-shadow: none;
    }

    /* 选项 2：美术馆极简画签 (Museum Fine-Art Plaque) */
    html[data-art-tag="museum-plaque"] .hero-artwork-tag {
      background: rgba(22, 28, 38, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(230, 195, 125, 0.45);
      border-bottom: 1.5px solid rgba(255, 230, 160, 0.65);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      color: #eddcb5;
    }
    html[data-art-tag="museum-plaque"] .hero-artwork-tag .hero-artwork-name {
      color: #fae8b8;
      font-family: var(--font-serif, "Source Han Serif CN", Georgia, serif);
      letter-spacing: 0.05em;
    }
    html[data-art-tag="museum-plaque"][data-theme="light"] .hero-artwork-tag {
      background: rgba(250, 248, 242, 0.90);
      border-color: rgba(180, 145, 80, 0.45);
      border-bottom-color: rgba(160, 120, 60, 0.65);
      color: #3d3424;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    }
    html[data-art-tag="museum-plaque"][data-theme="light"] .hero-artwork-tag .hero-artwork-name {
      color: #1e170c;
    }

    /* 选项 3：底图色谱自适应微光 (Adaptive Tint) */
    html[data-art-tag="adaptive-tint"] .hero-artwork-tag {
      background: rgba(14, 20, 30, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.2px solid rgba(130, 190, 255, 0.35);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 14px rgba(130, 190, 255, 0.2);
      color: #ffffff;
    }
    html[data-art-tag="adaptive-tint"] .hero-artwork-tag .hero-artwork-name {
      color: #7dd3fc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    html[data-art-tag="adaptive-tint"][data-theme="light"] .hero-artwork-tag {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08), 0 0 10px rgba(56, 189, 248, 0.2);
      color: #0c4a6e;
    }
    html[data-art-tag="adaptive-tint"][data-theme="light"] .hero-artwork-tag .hero-artwork-name {
      color: #0369a1;
      text-shadow: none;
    }

    /* 选项 4：原版现状 (暗色黑底 + 荧光绿字) */
    html[data-art-tag="original"] .hero-artwork-tag {
      background: rgba(11, 13, 16, 0.6) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: rgba(255, 255, 255, 0.85) !important;
      box-shadow: none !important;
    }
    html[data-art-tag="original"] .hero-artwork-tag .hero-artwork-name {
      color: #80cc28 !important; /* 荧光绿 */
      text-shadow: none !important;
    }
    html[data-art-tag="original"] .hero-artwork-prefix {
      display: none !important;
    }
    html[data-art-tag="original"] .hero-artwork-icon {
      display: none !important;
    }

  </style>

  <script>
    // 模式初始化
    
    // 铭牌优化按钮点击
    document.querySelectorAll('[data-target-badge]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-badge]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-badge', btn.getAttribute('data-target-badge'));
      });
    });

    // 默认启用 方案二 + 暖金提亮铭牌
    document.documentElement.setAttribute('data-mode', 'scheme-2');
    document.documentElement.setAttribute('data-badge', 'warm-gold');


    const heroImages = [
      { name: '重庆古城图', file: 'thumbs/hero/chongqing_ancient_city.webp' },
      { name: '成都蓝图', file: 'thumbs/hero/chengdu_blueprint.webp' },
      { name: '长株潭绿心浮雕', file: 'thumbs/hero/changsha_emboss.webp' },
      { name: '鄱阳湖水网', file: 'thumbs/hero/lake_poyang.webp' },
      { name: '南京银黑古都', file: 'thumbs/hero/nanjing_silver_black.webp' }
    ];
    let bgIndex = 0;

    // 背景轮换
    document.getElementById('btnSwitchBg').addEventListener('click', () => {
      bgIndex = (bgIndex + 1) % heroImages.length;
      const img = heroImages[bgIndex];
      document.getElementById('heroBgA').style.backgroundImage = `url('${img.file}')`;
      document.getElementById('heroArtworkName').textContent = img.name;
    });

    // 方案按钮点击
    document.querySelectorAll('[data-target-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-mode', btn.getAttribute('data-target-mode'));
      });
    });

    
    // 右上角胶囊形态切换
    document.querySelectorAll('[data-target-top-capsule]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-top-capsule]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-top-capsule', btn.getAttribute('data-target-top-capsule'));
      });
    });

    // 默认启用 03微晶磨砂胶囊
    document.documentElement.setAttribute('data-top-capsule', 'liquid-03');

    // 语言下拉菜单点击交互
    const langBtn = document.getElementById('btnHeroLangDropdown');
    const langMenu = document.getElementById('heroLangDropdownMenu');
    const langWrapper = document.getElementById('heroLangDropdownWrapper');
    if (langBtn && langMenu) {
      langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = langMenu.classList.toggle('open');
        langBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (langWrapper) langWrapper.classList.toggle('has-open', isOpen);
      });

      document.addEventListener('click', (e) => {
        if (langWrapper && !langWrapper.contains(e.target)) {
          langMenu.classList.remove('open');
          langBtn.setAttribute('aria-expanded', 'false');
          langWrapper.classList.remove('has-open');
        }
      });

      langMenu.querySelectorAll('.lang-dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
          langMenu.querySelectorAll('.lang-dropdown-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          const badge = item.querySelector('.lang-item-badge');
          if (badge) {
            document.getElementById('currentHeroLangLabel').textContent = badge.textContent === 'ZH' ? '中' : badge.textContent;
          }
          langMenu.classList.remove('open');
          langBtn.setAttribute('aria-expanded', 'false');
          if (langWrapper) langWrapper.classList.remove('has-open');
        });
      });
    }

    
    // 左下角图名形态切换
    document.querySelectorAll('[data-target-art-tag]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-art-tag]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-art-tag', btn.getAttribute('data-target-art-tag'));
      });
    });

    // 默认启用微晶磨砂图名画签
    document.documentElement.setAttribute('data-art-tag', 'liquid-glass');

    
    // 高光入射倾角切换
    document.querySelectorAll('[data-target-light-angle]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-light-angle]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-light-angle', btn.getAttribute('data-target-light-angle'));
      });
    });

    // 默认启用 135° 自然天光倾角
    document.documentElement.setAttribute('data-light-angle', '135deg');

    // 主题切换函数
    function toggleTheme(event) {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      // 检查是否支持 View Transition API 光晕波纹
      if (document.startViewTransition && event) {
        const x = event.clientX;
        const y = event.clientY;
        document.documentElement.style.setProperty('--ripple-x', `${x}px`);
        document.documentElement.style.setProperty('--ripple-y', `${y}px`);
        document.documentElement.classList.add('ripple-active');

        document.startViewTransition(() => {
          document.documentElement.setAttribute('data-theme', nextTheme);
          updateThemeButtons(nextTheme);
        }).finished.finally(() => {
          document.documentElement.classList.remove('ripple-active');
        });
      } else {
        document.documentElement.setAttribute('data-theme', nextTheme);
        updateThemeButtons(nextTheme);
      }
    }

    function updateThemeButtons(theme) {
      const dockBtn = document.getElementById('btnDockToggleTheme');
      if (theme === 'light') {
        dockBtn.textContent = '🌙 切换深色';
      } else {
        dockBtn.textContent = '☀️ 切换浅色';
      }
    }

    document.getElementById('btnHeroToggleTheme').addEventListener('click', toggleTheme);
    document.getElementById('btnDockToggleTheme').addEventListener('click', toggleTheme);
  </script>
</body>
</html>
