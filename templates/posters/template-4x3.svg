<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080">
  <defs>
    <style>
      .bg { fill: #0a0d14; }
      .frame { stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; fill: none; }
      .divider { stroke: rgba(255, 255, 255, 0.10); stroke-width: 1; fill: none; }
      .brand { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #d4a373; letter-spacing: 2px; }
      .slogan { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 500; fill: #8fa0ba; }
      .edition { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 600; fill: #8fa0ba; text-anchor: end; }
      .stage-box { fill: #141824; stroke: rgba(255, 255, 255, 0.15); stroke-width: 1.5; rx: 14px; }
      .stage-text { font-family: 'JetBrains Mono', monospace; font-size: 20px; fill: #8fa0ba; text-anchor: middle; }
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 30px; font-weight: 700; fill: #f0f3f8; }
      .category { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 500; fill: #8fa0ba; }
      .desc { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: 400; fill: #8fa0ba; line-height: 22px; }
      .swatch-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: #8fa0ba; }
      .qr-card { fill: #ffffff; rx: 12px; }
      .qr-placeholder { fill: #0a0d14; rx: 6px; }
      .qr-title { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 600; fill: #f0f3f8; }
      .qr-domain { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; font-weight: 500; fill: #8fa0ba; }
      .footer-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; font-weight: 400; fill: #8fa0ba; }
    </style>
  </defs>

  <!-- 1. 背景底色与外装饰框 -->
  <rect id="background" width="1440" height="1080" class="bg" />
  <rect id="frame" x="28" y="28" width="1384" height="1024" class="frame" />

  <!-- 2. 左侧主展台 (900 x 1000, cover 撑满) -->
  <g id="artwork-stage">
    <rect x="40" y="40" width="900" height="1000" class="stage-box" />
    <text x="490" y="525" class="stage-text">【左侧地图画卷展台 · 900 × 1000px】</text>
    <text x="490" y="565" class="stage-text" style="font-size: 15px; opacity: 0.7;">(object-fit: cover 裁切填满 · 无白边)</text>
  </g>

  <!-- 3. 右侧专栏 (rx = 980, rw = 420) -->
  <!-- 3.1 页眉 -->
  <g id="right-header">
    <text x="980" y="84" class="brand">OPENQGIS · ATLASLOG</text>
    <text x="980" y="114" class="slogan">「一图一境 · 静观其详」</text>
    <text x="1400" y="84" class="edition">2026 EDITION</text>
    <line x1="980" y1="136" x2="1400" y2="136" class="divider" />
  </g>

  <!-- 3.2 题名与分类 -->
  <g id="right-title-meta">
    <text x="980" y="196" class="title">地图作品题名示例</text>
    <text x="980" y="254" class="category">原创图 · 艺术制图 · 空间形态</text>
    <text x="980" y="278" class="category">古城古韵   |   匠师：OpenQGIS</text>
  </g>

  <!-- 3.3 说明题记 -->
  <g id="right-description">
    <text x="980" y="324" class="desc">深蓝的两江把渝中半岛夹成一条船，十七座城门</text>
    <text x="980" y="350" class="desc">顺着半岛脊线绕出满满一圈。城墙不走直线，跟着</text>
    <text x="980" y="376" class="desc">山势起伏。两江交汇的半岛骨架：长江与嘉陵江在</text>
    <text x="980" y="402" class="desc">朝天门下交汇，城市被水托着，格局天成。</text>
  </g>

  <!-- 3.4 艺术色彩色板 -->
  <g id="right-palette">
    <text x="980" y="490" class="swatch-title">COLOR PALETTE</text>
    <g transform="translate(980, 500)">
      <rect x="0" y="0" width="38" height="18" rx="4" fill="#00a896" />
      <rect x="46" y="0" width="38" height="18" rx="4" fill="#028090" />
      <rect x="92" y="0" width="38" height="18" rx="4" fill="#05668d" />
      <rect x="138" y="0" width="38" height="18" rx="4" fill="#f0f3f8" />
      <rect x="184" y="0" width="38" height="18" rx="4" fill="#3a506b" />
      <rect x="230" y="0" width="38" height="18" rx="4" fill="#1c2541" />
    </g>
  </g>

  <!-- 3.5 二维码卡片与文案 -->
  <g id="right-qr">
    <rect x="980" y="844" width="132" height="132" class="qr-card" />
    <rect x="988" y="852" width="116" height="116" class="qr-placeholder" />
    <text x="1046" y="915" fill="#ffffff" font-family="monospace" font-size="12px" text-anchor="middle">QR CODE</text>

    <!-- 二维码右侧导引文案 -->
    <text x="1134" y="894" class="qr-title">Atlas 地图录</text>
    <text x="1134" y="920" class="qr-domain">探索QGIS能力边界</text>
  </g>

  <!-- 3.6 页脚与版权声明 -->
  <g id="right-footer">
    <line x1="980" y1="1000" x2="1400" y2="1000" class="divider" />
    <text x="980" y="1028" class="footer-text">© 2026 OpenQGIS / AtlasLog · 个人空间工造与视觉典藏</text>
  </g>
</svg>
