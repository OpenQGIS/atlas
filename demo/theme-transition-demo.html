<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-scheme="schemeA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>液态玻璃波纹动效方案体验 · 成都古城墙</title>
  <script src="../vendor/openseadragon.min.js"></script>
  <style>
    :root {
      --bg: #07080b;
      --surface: rgba(16, 22, 32, 0.72);
      --surface-border: rgba(255, 255, 255, 0.14);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #80cc28;
      --accent-rgb: 128, 204, 40;
      --ripple-x: 50%;
      --ripple-y: 95%;
    }

    [data-theme="light"] {
      --bg: #edf1f7;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-border: rgba(0, 0, 0, 0.1);
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #55991b;
      --accent-rgb: 85, 153, 27;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 顶部方案切换控制器 */
    .scheme-switcher-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 9999px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      max-width: calc(100vw - 32px);
      white-space: nowrap;
    }

    .scheme-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .scheme-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
    .scheme-btn:active { transform: scale(0.95); }
    .scheme-btn.active {
      color: #07080b;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.4);
    }
    :root[data-theme="light"] .scheme-btn.active { color: #ffffff; }

    /* 说明条 */
    .scheme-info-tip {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 990;
      max-width: 720px;
      padding: 8px 18px;
      border-radius: 10px;
      background: rgba(12, 16, 22, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12.5px;
      line-height: 1.5;
      text-align: center;
      color: #cbd5e1;
      pointer-events: none;
    }
    :root[data-theme="light"] .scheme-info-tip {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(0, 0, 0, 0.1);
      color: #334155;
    }

    /* 背景环境光 */
    .viewer-ambient-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(135deg, #161c28 0%, #0d121a 50%, #07080b 100%);
      transition: background 0.6s ease;
    }
    :root[data-theme="light"] .viewer-ambient-backdrop {
      background: radial-gradient(circle at 50% 50%, rgba(200, 210, 228, 0.35) 0%, rgba(240, 242, 246, 0.85) 100%),
                  linear-gradient(135deg, #f8fafc 0%, #eef2f7 50%, #e2e8f0 100%);
    }

    /* OpenSeadragon 视口舞台 */
    #osdStage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent !important;
      transition: filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 深色模式：深邃夜幕古城图 (Midnight Navy Cartography)，高反差、暗色调、不刺眼 */
    :root[data-theme="dark"] #osdStage,
    :root[data-theme="dark"] #osdNavigator {
      filter: invert(0.92) hue-rotate(180deg) brightness(0.88) contrast(1.18);
    }

    /* 浅色模式：原生典雅白描蓝线画卷 (Daylight Blueprint) */
    :root[data-theme="light"] #osdStage,
    :root[data-theme="light"] #osdNavigator {
      filter: none;
    }

    /* 左上角铭牌 */
    .artwork-badge {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 450;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(15, 20, 28, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    :root[data-theme="light"] .artwork-badge {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .badge-title { font-size: 13.5px; font-weight: 700; color: var(--text); }
    .badge-sub { font-size: 11px; font-weight: 600; color: #80cc28; font-family: ui-monospace, monospace; }

    /* 右上角操作按钮 */
    .top-right-actions {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 450;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.06); }
    .action-btn:active { transform: scale(0.92); }

    /* 左下角鹰眼图 */
    .navigator-wrapper {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 450;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .navigator-stage { width: 200px; height: 135px; position: relative; }
    #osdNavigator { width: 100%; height: 100%; }

    /* 底部液态玻璃 Dock 栏 */
    .viewer-floating-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 450;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
    }
    :root[data-theme="light"] .viewer-floating-toolbar {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }

    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tool-btn:hover { background: rgba(128, 204, 40, 0.2); color: var(--accent); }
    .zoom-pill {
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(128, 204, 40, 0.15);
      border: 1px solid rgba(128, 204, 40, 0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
    }

    /* ══════════════════════════════════════════════════════════════════
       液态玻璃专用动效图层与三种物理机制
       ══════════════════════════════════════════════════════════════════ */

    /* 专用液态玻璃波纹层（置于 z-index: 900，在置顶工具栏下方、底层画布与ViewTransition之上，呈现双层玻璃物理纵深） */
    #glassWaveLayer {
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────────────────────
       方案 A：液态玻璃折射透镜光环 (Liquid Glass Ring Wave)
       - 完美还原晶莹通透的物理环形折射水光！
       - 真实 backdrop-filter 凸透镜折射与高折射菲涅尔水膜
       ───────────────────────────────────────────────────────────── */
    .glass-ring-effect {
      position: absolute;
      left: var(--ripple-x);
      top: var(--ripple-y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      width: 0;
      height: 0;
      background: radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.15) 78%, rgba(255, 255, 255, 0.75) 90%, rgba(255, 255, 255, 0.95) 96%, transparent 100%);
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.5), 0 0 55px rgba(128, 204, 40, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px) brightness(1.15) contrast(1.08);
      -webkit-backdrop-filter: blur(12px) brightness(1.15) contrast(1.08);
      border: 2px solid rgba(255, 255, 255, 0.85);
      opacity: 0;
    }
    :root[data-theme="light"] .glass-ring-effect {
      background: radial-gradient(circle, transparent 62%, rgba(85, 153, 27, 0.12) 78%, rgba(85, 153, 27, 0.65) 90%, rgba(85, 153, 27, 0.85) 96%, transparent 100%);
      box-shadow: 0 0 28px rgba(85, 153, 27, 0.45), inset 0 0 20px rgba(85, 153, 27, 0.3);
      border-color: rgba(85, 153, 27, 0.85);
    }
    .animate-glass-ring {
      animation: glassRingExpand 0.58s cubic-bezier(0.18, 0.9, 0.25, 1) forwards;
    }
    /* 紧凑利落：580ms 迅速掠过并气化隐退，消灭尾部拖沓 */
    @keyframes glassRingExpand {
      0% { width: 0; height: 0; opacity: 1; }
      50% { opacity: 0.95; }
      80% { opacity: 0.5; }
      100% { width: 240vmax; height: 240vmax; opacity: 0; }
    }

    /* ─────────────────────────────────────────────────────────────
       方案 B：Dock 液态水银溢流熔铸 (Dock Liquid Melt)
       ───────────────────────────────────────────────────────────── */
    :root[data-scheme="schemeB"].dock-melting .viewer-floating-toolbar {
      transform: translateX(-50%) scale(1.12);
      box-shadow: 0 0 70px rgba(var(--accent-rgb), 0.8);
      border-color: var(--accent);
    }
    .dock-melt-curtain {
      position: absolute;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      backdrop-filter: blur(24px) brightness(1.15);
      -webkit-backdrop-filter: blur(24px) brightness(1.15);
      border-radius: 50%;
    }
    .animate-dock-melt {
      animation: dockMeltSurge 0.78s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
    }
    @keyframes dockMeltSurge {
      0% {
        opacity: 0.95;
        clip-path: circle(20px at var(--ripple-x) var(--ripple-y));
      }
      60% {
        opacity: 0.9;
        clip-path: circle(70vmax at var(--ripple-x) var(--ripple-y));
      }
      100% {
        opacity: 0;
        clip-path: circle(160vmax at var(--ripple-x) var(--ripple-y));
      }
    }

    /* ─────────────────────────────────────────────────────────────
       方案 C：双层毛玻璃遮罩反向推移 (Frosted Lens Iris)
       ───────────────────────────────────────────────────────────── */
    .frost-iris-outer {
      position: absolute;
      left: var(--ripple-x);
      top: var(--ripple-y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.6);
    }
    .animate-frost-iris {
      animation: frostIrisExpand 0.76s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes frostIrisExpand {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 260vmax; height: 260vmax; opacity: 0; }
    }

    /* 原生 View Transition 根伪元素通用规则 */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 2; }

    /* View Transition 驱动的纯色底层推进动画（同步提速至 0.55s，轻快利落） */
    :root.vt-ripple-active::view-transition-new(root) {
      animation: baseRippleExpand 0.55s cubic-bezier(0.2, 0.85, 0.25, 1);
    }
    @keyframes baseRippleExpand {
      from {
        -webkit-clip-path: circle(0px at var(--ripple-x) var(--ripple-y));
        clip-path: circle(0px at var(--ripple-x) var(--ripple-y));
      }
      to {
        -webkit-clip-path: circle(160vmax at var(--ripple-x) var(--ripple-y));
        clip-path: circle(160vmax at var(--ripple-x) var(--ripple-y));
      }
    }
  </style>
</head>
<body data-scheme="schemeA">

  <!-- 顶部方案切换选择栏 -->
  <div class="scheme-switcher-bar">
    <button class="scheme-btn active" data-scheme="schemeA" title="点击体验方案 A（重复点击切换明暗）">🌟 方案 A：折射透镜环 (推荐)</button>
    <button class="scheme-btn" data-scheme="schemeB" title="点击体验方案 B（重复点击切换明暗）">方案 B：水银溢流熔铸</button>
    <button class="scheme-btn" data-scheme="schemeC" title="点击体验方案 C（重复点击切换明暗）">方案 C：双层毛玻璃推移</button>
  </div>

  <!-- 说明条 -->
  <div class="scheme-info-tip" id="schemeInfoTip">
    <strong>🌟 方案 A【液态玻璃折射透镜光环 · 强烈推荐】</strong>：彻底告别失焦高斯模糊！画作保持 100% 清晰，一道带微光发光边缘的<strong>液态玻璃凸透镜环从按钮向外荡开</strong>，光环划过瞬间画卷折射微芒，与 Dock 栏的液态玻璃材质浑然天成！
  </div>

  <!-- 背景环境光 -->
  <div class="viewer-ambient-backdrop"></div>

  <!-- OpenSeadragon 真实画布容器 -->
  <div id="osdStage"></div>

  <!-- 液态玻璃专用物理波纹动效层 -->
  <div id="glassWaveLayer"></div>

  <!-- 左上角标题徽章 -->
  <div class="artwork-badge">
    <span class="badge-title">成都古城墙-城门</span>
    <span class="badge-sub">OpenQGIS · Art Cartography</span>
  </div>

  <!-- 右上角工具按钮 (含主题切换) -->
  <div class="top-right-actions">
    <button class="action-btn" id="btnThemeToggle" title="切换明暗主题 (体验液态玻璃波纹)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
    </button>
    <button class="action-btn" title="关闭">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

  <!-- 左下角鹰眼图 -->
  <div class="navigator-wrapper">
    <div class="navigator-stage">
      <div id="osdNavigator"></div>
    </div>
  </div>

  <!-- 底部液态玻璃 Dock 控制栏 -->
  <div class="viewer-floating-toolbar" id="bottomDock">
    <button class="tool-btn" id="btnPrev" title="上一卷">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="zoom-pill" id="zoomBadge">100%</div>
    <button class="tool-btn" id="btnFit" title="适屏全景">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="tool-btn" id="btnRotate" title="旋转">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg>
    </button>
    <button class="tool-btn" id="btnFullscreen" title="全屏">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="tool-btn" id="btnThemeBottom" title="点击切换明暗主题 (体验液态玻璃波纹)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
    </button>
    <button class="tool-btn" id="btnNext" title="下一卷">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <script>
    // 1. 初始化 OpenSeadragon 真实切片引擎
    const viewer = OpenSeadragon({
      id: 'osdStage',
      prefixUrl: '',
      tileSources: {
        width: 2834,
        height: 2125,
        tileSize: 256,
        tileOverlap: 0,
        minLevel: 0,
        maxLevel: 12,
        getTileUrl: function(level, x, y) {
          return '../tiles/chengdu_citywall_gates_files/' + level + '/' + x + '_' + y + '.webp';
        }
      },
      showNavigationControl: false,
      showNavigator: true,
      navigatorId: 'osdNavigator',
      navigatorPosition: 'BOTTOM_LEFT',
      navigatorBackground: 'transparent',
      navigatorBorderColor: '#80cc28',
      navigatorDisplayRegionColor: 'rgba(128, 204, 40, 0.28)',
      animationTime: 0.45,
      blendTime: 0.1,
      maxZoomPixelRatio: 3.5,
      defaultZoomLevel: 0.95
    });

    viewer.addHandler('zoom', function() {
      const zoom = Math.round(viewer.viewport.getZoom() * 100);
      document.getElementById('zoomBadge').textContent = zoom + '%';
    });

    document.getElementById('btnFit').addEventListener('click', () => viewer.viewport.goHome());
    document.getElementById('btnRotate').addEventListener('click', () => viewer.viewport.setRotation(viewer.viewport.getRotation() + 90));

    // 2. 方案切换逻辑
    const tipMap = {
      schemeA: '<strong>🌟 方案 A【液态玻璃折射透镜光环 · 强烈推荐】</strong>：彻底告别失焦高斯模糊！画作保持 100% 清晰，一道带微光发光边缘的<strong>液态玻璃凸透镜环从按钮向外荡开</strong>，光环划过瞬间画卷折射微芒，与 Dock 栏的液态玻璃材质浑然天成！',
      schemeB: '<strong>方案 B【Dock 液态水银溢流熔铸】</strong>：点击底部 Dock 时，胶囊栏产生<strong>液态水银破泡与向外溢流拉扯感</strong>，新主题从 Dock 内部流淌到全屏，富有强烈的实体流动物理质感！',
      schemeC: '<strong>方案 C【双层毛玻璃遮罩推移】</strong>：由外层高雾度柔焦玻璃光圈先行探路、内层纯净光环紧随铺展，<strong>双层嵌套消除所有纯色硬切边缘</strong>！'
    };

    const schemeBtns = document.querySelectorAll('.scheme-btn');
    const infoTipEl = document.getElementById('schemeInfoTip');
    let currentScheme = 'schemeA';

    schemeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (isTransitioning) return;
        schemeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentScheme = btn.dataset.scheme;
        document.documentElement.setAttribute('data-scheme', currentScheme);
        document.body.setAttribute('data-scheme', currentScheme);
        infoTipEl.innerHTML = tipMap[currentScheme];

        // 点击或重复点击模式按钮，立即自动切换明暗主题并体验该方案波纹动效
        handleToggleTheme(e);
      });
    });

    // 3. 核心动效控制器：将波纹与液态玻璃无缝融合
    let isTransitioning = false;
    const waveLayer = document.getElementById('glassWaveLayer');
    const bottomDock = document.getElementById('bottomDock');

    function handleToggleTheme(e) {
      if (isTransitioning) return;
      isTransitioning = true;

      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      // 提取点击坐标
      let x = window.innerWidth / 2;
      let y = window.innerHeight * 0.95;
      if (currentScheme === 'schemeB' && (!e || !e.currentTarget || e.currentTarget.id !== 'btnThemeToggle')) {
        // 方案 B：Dock 水银溢流熔铸，波纹始终从底部 Dock 向上溢流
        const dockRect = bottomDock.getBoundingClientRect();
        x = dockRect.left + dockRect.width / 2;
        y = dockRect.top + dockRect.height / 2;
      } else if (e && e.currentTarget) {
        const rect = e.currentTarget.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      }

      document.documentElement.style.setProperty('--ripple-x', `${x}px`);
      document.documentElement.style.setProperty('--ripple-y', `${y}px`);

      // 清理历史图层
      waveLayer.innerHTML = '';
      waveLayer.style.opacity = '1';

      if (currentScheme === 'schemeA') {
        // ── 方案 A：液态玻璃折射透镜光环 ──
        // 创建独立的玻璃透镜环 DOM
        const ring = document.createElement('div');
        ring.className = 'glass-ring-effect animate-glass-ring';
        waveLayer.appendChild(ring);

        // 同步启动底层纯色 View Transition
        runViewTransition(nextTheme, () => {
          waveLayer.innerHTML = '';
          waveLayer.style.opacity = '0';
          isTransitioning = false;
        });

      } else if (currentScheme === 'schemeB') {
        // ── 方案 B：Dock 液态水银溢流熔铸 ──
        document.documentElement.classList.add('dock-melting');
        const meltCurtain = document.createElement('div');
        meltCurtain.className = 'dock-melt-curtain animate-dock-melt';
        waveLayer.appendChild(meltCurtain);

        runViewTransition(nextTheme, () => {
          document.documentElement.classList.remove('dock-melting');
          waveLayer.innerHTML = '';
          waveLayer.style.opacity = '0';
          isTransitioning = false;
        });

      } else if (currentScheme === 'schemeC') {
        // ── 方案 C：双层毛玻璃遮罩推移 ──
        const iris = document.createElement('div');
        iris.className = 'frost-iris-outer animate-frost-iris';
        waveLayer.appendChild(iris);

        runViewTransition(nextTheme, () => {
          waveLayer.innerHTML = '';
          waveLayer.style.opacity = '0';
          isTransitioning = false;
        });
      }
    }

    function runViewTransition(nextTheme, onDone) {
      if (document.startViewTransition) {
        document.documentElement.classList.add('vt-ripple-active');
        const transition = document.startViewTransition(() => {
          document.documentElement.setAttribute('data-theme', nextTheme);
        });
        transition.finished.finally(() => {
          document.documentElement.classList.remove('vt-ripple-active');
          if (onDone) onDone();
        });
      } else {
        document.documentElement.setAttribute('data-theme', nextTheme);
        if (onDone) onDone();
      }
    }

    document.getElementById('btnThemeToggle').addEventListener('click', handleToggleTheme);
    document.getElementById('btnThemeBottom').addEventListener('click', handleToggleTheme);
  </script>
</body>
</html>
