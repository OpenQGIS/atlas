<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>首屏深浅主题切换效果对比 Demo · AtlasLog</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Demo 专属控制悬浮面板 */
    .demo-control-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(18, 22, 30, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 100px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255,255,255,0.3);
      color: #fff;
      font-size: 0.82rem;
      user-select: none;
      transition: all 0.3s ease;
    }
    :root[data-theme="light"] .demo-control-dock {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.12);
      color: #1a1f2c;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 0 1px rgba(0,0,0,0.2);
    }
    .demo-pill-group {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 99px;
      padding: 3px;
      gap: 2px;
    }
    :root[data-theme="light"] .demo-pill-group {
      background: rgba(0, 0, 0, 0.06);
    }
    .demo-btn {
      background: transparent;
      border: none;
      color: inherit;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .demo-btn.active {
      background: #e6c37d;
      color: #1a1308;
      box-shadow: 0 2px 8px rgba(230, 195, 125, 0.4);
      font-weight: 600;
    }
    .demo-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.18);
    }
    :root[data-theme="light"] .demo-divider {
      background: rgba(0, 0, 0, 0.12);
    }

    /* 方案模式切换支持 */
    /* 1. 现状模式 (Before - 浅色时首屏不变化，依然黑夜) */
    html[data-mode="before"][data-theme="light"] .hero-screen {
      background-color: #0b0d10 !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(11, 13, 16, 0.4) 0%, rgba(11, 13, 16, 0.88) 100%),
                  linear-gradient(to bottom, rgba(11, 13, 16, 0.5) 0%, transparent 35%, rgba(11, 13, 16, 0.8) 100%) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="before"][data-theme="light"] .hero-slogan-sep-svg {
      color: #ffffff !important;
      filter: drop-shadow(0 4px 28px rgba(0, 0, 0, 0.85)) drop-shadow(0 1px 4px rgba(0, 0, 0, 0.95)) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-subtitle {
      color: rgba(255, 255, 255, 0.9) !important;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7) !important;
    }
    html[data-mode="before"][data-theme="light"] .hero-desc {
      color: rgba(255, 255, 255, 0.65) !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7) !important;
    }

    /* 2. 方案一：昼夜双生质感（Day/Night Contrast · 宣纸水墨 vs 夜境沉浸 · 推荐） */
    html[data-mode="scheme-1"] .hero-screen,
    html[data-mode="scheme-1"] .hero-bg,
    html[data-mode="scheme-1"] .hero-scrim,
    html[data-mode="scheme-1"] .hero-slogan-svg,
    html[data-mode="scheme-1"] .hero-subtitle,
    html[data-mode="scheme-1"] .hero-desc {
      transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  text-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-screen {
      background-color: #f6f7f9 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-bg {
      filter: brightness(1.02) contrast(1.02) saturate(1.05) !important;
      opacity: 0.88 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(246, 247, 249, 0.35) 0%, rgba(246, 247, 249, 0.82) 100%),
                  linear-gradient(to bottom, rgba(246, 247, 249, 0.6) 0%, transparent 40%, rgba(246, 247, 249, 0.92) 100%) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="scheme-1"][data-theme="light"] .hero-slogan-sep-svg {
      color: #141a24 !important;
      filter: drop-shadow(0 2px 14px rgba(255, 255, 255, 0.9)) drop-shadow(0 1px 2px rgba(20, 26, 36, 0.2)) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-subtitle {
      color: #2b3342 !important;
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.95) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-desc {
      color: #556072 !important;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.95) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .hero-scroll-btn {
      color: #2b3342 !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .scroll-mouse-anim {
      border-color: rgba(43, 51, 66, 0.5) !important;
    }
    html[data-mode="scheme-1"][data-theme="light"] .scroll-mouse-dot {
      background-color: #2b3342 !important;
    }

    /* 3. 方案二：柔光微霜轻覆（Soft Frost Wash） */
    html[data-mode="scheme-2"][data-theme="light"] .hero-screen {
      background-color: #18202c !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-bg {
      filter: brightness(0.85) contrast(1.05) saturate(1.15) !important;
      opacity: 0.9 !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-scrim {
      background: radial-gradient(ellipse at center, rgba(230, 238, 248, 0.15) 0%, rgba(20, 28, 40, 0.75) 100%),
                  linear-gradient(to bottom, rgba(240, 244, 250, 0.2) 0%, transparent 40%, rgba(20, 28, 40, 0.85) 100%) !important;
    }
    html[data-mode="scheme-2"][data-theme="light"] .hero-slogan-svg,
    html[data-mode="scheme-2"][data-theme="light"] .hero-slogan-sep-svg {
      color: #ffffff !important;
      filter: drop-shadow(0 4px 20px rgba(10, 16, 26, 0.9)) drop-shadow(0 0 35px rgba(230, 195, 125, 0.4)) !important;
    }

    /* 圆形光晕涟漪过渡效果 (View Transition / Clip Path Ripple) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) {
      z-index: 1;
    }
    ::view-transition-new(root) {
      z-index: 999;
    }
    .ripple-active::view-transition-new(root) {
      animation: rippleExpand 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes rippleExpand {
      from {
        clip-path: circle(0px at var(--ripple-x, 95%) var(--ripple-y, 30px));
      }
      to {
        clip-path: circle(150vmax at var(--ripple-x, 95%) var(--ripple-y, 30px));
      }
    }
  
    /* ========================================================
       铭牌暗色模式优化方案 (解决“暗色下边还是很暗”的问题)
       ======================================================== */
    /* 铭牌基础过渡 */
    .hero-brand-capsule,
    .hero-brand-capsule .hero-brand-svg {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* 方案 A：暖金古铜 + 底部暖金反光切角 (消除下部死黑，提亮下半段) */
    html[data-badge="warm-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        #725b33 0%,
        #4c3a1d 25%,
        #886e3f 50%,
        #3e2f16 58%,
        #614d27 82%,
        #463519 100%
      ) !important;
      border: 1px solid rgba(255, 225, 150, 0.6) !important;
      border-bottom: 1.5px solid rgba(255, 235, 175, 0.75) !important; /* 关键：底沿高光金线托底 */
      box-shadow:
        inset 0 1.5px 2px rgba(255, 240, 195, 0.75),
        inset 0 -1.5px 2px rgba(255, 220, 130, 0.4), /* 关键：将死黑内阴影替换为暖金底缘回光 */
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 16px rgba(230, 185, 95, 0.25) !important; /* 柔和暖金环境微光 */
      color: #fae7ba !important; /* 文字改为香槟暖金色，黑夜中清晰夺目 */
    }
    html[data-badge="warm-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.95))
        drop-shadow(0 0 1px rgba(255, 240, 190, 0.6)) !important;
    }

    /* 方案 B：温润亮黄铜（与浅色同为纯铜金印，黑夜中金牌璀璨） */
    html[data-badge="bright-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        #f5ecd5 0%,
        #d8c292 25%,
        #fcf6e8 50%,
        #c9ae78 65%,
        #eddcb5 85%,
        #d4bc88 100%
      ) !important;
      border: 1px solid rgba(210, 175, 105, 0.75) !important;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px rgba(120, 90, 35, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.65),
        0 0 20px rgba(230, 195, 125, 0.32) !important;
      color: #2b1f0c !important; /* 阴刻深墨字标，8:1 高对比度 */
    }
    html[data-badge="bright-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 1.2px 0 rgba(255, 255, 255, 0.85))
        drop-shadow(0 -1px 0.5px rgba(60, 45, 20, 0.5)) !important;
    }

    /* 方案 C：黑曜微晶 + 鎏金立体字标 + 金边环绕 (现代低调轻奢) */
    html[data-badge="obsidian-gold"]:not([data-theme="light"]) .hero-brand-capsule {
      background: linear-gradient(
        135deg,
        rgba(36, 44, 58, 0.85) 0%,
        rgba(18, 22, 30, 0.92) 50%,
        rgba(26, 32, 44, 0.9) 100%
      ) !important;
      border: 1px solid rgba(230, 195, 125, 0.55) !important;
      border-bottom: 1.5px solid rgba(255, 230, 160, 0.7) !important;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.2),
        inset 0 -1.5px 2px rgba(230, 195, 125, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(230, 195, 125, 0.2) !important;
      color: #f7dfa5 !important;
    }
    html[data-badge="obsidian-gold"]:not([data-theme="light"]) .hero-brand-capsule .hero-brand-svg {
      filter:
        drop-shadow(0 0 8px rgba(230, 195, 125, 0.5))
        drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9)) !important;
    }

  </style>
</head>

      <p class="hero-subtitle" id="heroSubtitle" data-i18n-html="heroSubslogan"><span class="hero-sub-chunk">地图录</span><span class="hero-sub-sep"> · </span><span class="hero-sub-chunk">OpenQGIS 制图作品集</span></p>
      <div class="hero-desc" data-i18n="heroDesc">个人制图实践 · QGIS 能力边界的记录</div>
    </div>

    <!-- Active Artwork Label -->
    <div class="hero-artwork-tag" id="heroArtworkTag">
      <span class="hero-artwork-name" id="heroArtworkName">重庆古城图 (Chongqing Ancient City)</span>
    </div>

    <!-- Scroll Down Prompt Button -->
    <button class="hero-scroll-btn" id="heroScrollBtn" aria-label="向下探索">
      <span class="hero-scroll-text">向下探索</span>
      <div class="scroll-mouse-anim">
        <div class="scroll-mouse-dot"></div>
      </div>
      <svg class="icon scroll-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </section>

    <!-- 悬浮方案与铭牌效果对比调试器 -->
  <div class="demo-control-dock" style="flex-wrap: wrap; justify-content: center; max-width: 90vw; padding: 8px 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-weight: 600; font-size: 0.8rem; opacity: 0.9;">🎨 首屏主题：</span>
      <div class="demo-pill-group">
        <button class="demo-btn" data-target-mode="before">现状（无感）</button>
        <button class="demo-btn" data-target-mode="scheme-1">方案一：昼夜双生</button>
        <button class="demo-btn active" data-target-mode="scheme-2">方案二：柔光微霜</button>
      </div>
    </div>

    <div class="demo-divider"></div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-weight: 600; font-size: 0.8rem; color: #e6c37d;">🏷️ 铭牌暗色优化：</span>
      <div class="demo-pill-group">
        <button class="demo-btn" data-target-badge="original">现状（偏暗）</button>
        <button class="demo-btn active" data-target-badge="warm-gold">暖金+底沿反光 (推荐)</button>
        <button class="demo-btn" data-target-badge="bright-gold">亮黄铜金印</button>
        <button class="demo-btn" data-target-badge="obsidian-gold">黑曜鎏金</button>
      </div>
    </div>

    <div class="demo-divider"></div>

    <button class="demo-btn" id="btnSwitchBg" title="换一幅背景地图">
      🖼️ 换背景
    </button>

    <div class="demo-divider"></div>

    <button class="demo-btn" id="btnDockToggleTheme" style="background: rgba(230, 195, 125, 0.25); border: 1px solid rgba(230, 195, 125, 0.5); font-weight: 600;">
      ☀️ 切换深浅
    </button>
  </div>

  <script>
    // 模式初始化
    
    // 铭牌优化按钮点击
    document.querySelectorAll('[data-target-badge]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-badge]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-badge', btn.getAttribute('data-target-badge'));
      });
    });

    // 默认启用 方案二 + 暖金提亮铭牌
    document.documentElement.setAttribute('data-mode', 'scheme-2');
    document.documentElement.setAttribute('data-badge', 'warm-gold');


    const heroImages = [
      { name: '重庆古城图', file: 'thumbs/hero/chongqing_ancient_city.webp' },
      { name: '成都蓝图', file: 'thumbs/hero/chengdu_blueprint.webp' },
      { name: '长株潭绿心浮雕', file: 'thumbs/hero/changsha_emboss.webp' },
      { name: '鄱阳湖水网', file: 'thumbs/hero/lake_poyang.webp' },
      { name: '南京银黑古都', file: 'thumbs/hero/nanjing_silver_black.webp' }
    ];
    let bgIndex = 0;

    // 背景轮换
    document.getElementById('btnSwitchBg').addEventListener('click', () => {
      bgIndex = (bgIndex + 1) % heroImages.length;
      const img = heroImages[bgIndex];
      document.getElementById('heroBgA').style.backgroundImage = `url('${img.file}')`;
      document.getElementById('heroArtworkName').textContent = img.name;
    });

    // 方案按钮点击
    document.querySelectorAll('[data-target-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-target-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.setAttribute('data-mode', btn.getAttribute('data-target-mode'));
      });
    });

    // 主题切换函数
    function toggleTheme(event) {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      // 检查是否支持 View Transition API 光晕波纹
      if (document.startViewTransition && event) {
        const x = event.clientX;
        const y = event.clientY;
        document.documentElement.style.setProperty('--ripple-x', `${x}px`);
        document.documentElement.style.setProperty('--ripple-y', `${y}px`);
        document.documentElement.classList.add('ripple-active');

        document.startViewTransition(() => {
          document.documentElement.setAttribute('data-theme', nextTheme);
          updateThemeButtons(nextTheme);
        }).finished.finally(() => {
          document.documentElement.classList.remove('ripple-active');
        });
      } else {
        document.documentElement.setAttribute('data-theme', nextTheme);
        updateThemeButtons(nextTheme);
      }
    }

    function updateThemeButtons(theme) {
      const dockBtn = document.getElementById('btnDockToggleTheme');
      if (theme === 'light') {
        dockBtn.textContent = '🌙 切换深色';
      } else {
        dockBtn.textContent = '☀️ 切换浅色';
      }
    }

    document.getElementById('btnHeroToggleTheme').addEventListener('click', toggleTheme);
    document.getElementById('btnDockToggleTheme').addEventListener('click', toggleTheme);
  </script>
